[project]
name = "japan-grocery-intelligence"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "apscheduler<4",
    "loguru>=0.8.0",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "protego>=0.7.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pymupdf>=2.2",
    "pyyaml>=6.0.4",
    "scrapling[fetchers]>=0.5.1",
    "sqlalchemy>=2.1.9",
    "typer>=0.29.3",
]

[project.scripts]
grocery = "grocery_intelligence.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grocery_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]
